services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    networks:
      - rp-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: resume
      RABBITMQ_DEFAULT_PASS: resume123
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - rp-network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  api-server:
    image: resume_parser-api-server:latest
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/resume_parser
      RABBITMQ_URL: amqp://resume:resume123@rabbitmq:5672
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: 10
      MAX_FILES_PER_UPLOAD: 10
      CORS_ORIGIN: http://localhost
    volumes:
      - uploads:/app/uploads
    networks:
      - rp-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  parser-service:
    image: resume_parser-parser-service:latest
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/resume_parser
      RABBITMQ_URL: amqp://resume:resume123@rabbitmq:5672
    volumes:
      - uploads:/app/uploads
    networks:
      - rp-network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  ocr-service:
    image: resume_parser-ocr-service:latest
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/resume_parser
      RABBITMQ_URL: amqp://resume:resume123@rabbitmq:5672
      OCR_TEMP_DIR: /tmp/ocr
      OCR_LANGUAGE: eng
      OCR_DPI: 300
    volumes:
      - uploads:/app/uploads
    networks:
      - rp-network
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  insights-worker:
    image: resume_parser-insights-worker:latest
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/resume_parser
      RABBITMQ_URL: amqp://resume:resume123@rabbitmq:5672
    networks:
      - rp-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: resume_parser-frontend:latest
    ports:
      - "80:80"
    networks:
      - rp-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  mongo_data:
  rabbitmq_data:
  uploads:

networks:
  rp-network:
    driver: overlay